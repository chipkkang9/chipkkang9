  <g transform="translate(806 312)">
    <rect x="0" y="0" width="294" height="42" rx="21" fill="#020617" fill-opacity="0.56" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="24" y="27" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">Threat model -> insight -> defense</text>
  </g>
