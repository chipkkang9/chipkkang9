<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SangHyeon Park AI Security Research</title>
  <desc id="desc">A custom profile banner showing a research pipeline from multimodal AI safety failures to behavior analysis, activation steering, and defense.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.48" stop-color="#101827"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="signal" x1="148" y1="331" x2="1048" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="0.45" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.28 0 0 0 0 0.86 0 0 0 0 0.78 0 0 0 0.36 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="32" fill="url(#grid)"/>

  <circle cx="984" cy="74" r="130" fill="#2DD4BF" opacity="0.08"/>
  <circle cx="112" cy="346" r="150" fill="#FB7185" opacity="0.08"/>

  <g opacity="0.2">
    <path d="M78 294C207 224 255 331 372 263C470 206 509 118 626 152C722 180 762 286 868 234C949 194 987 89 1122 112" stroke="url(#signal)" stroke-width="2"/>
    <path d="M86 323C211 271 270 342 380 303C483 267 515 169 631 198C733 224 758 321 875 282C965 252 1017 161 1120 178" stroke="url(#signal)" stroke-width="2"/>
  </g>

  <g transform="translate(76 78)">
    <text x="0" y="0" fill="#8DDAD2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="3">AI SECURITY RESEARCH</text>
    <text x="0" y="66" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="60" font-weight="800">SangHyeon Park</text>
    <text x="2" y="108" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="500">Multimodal safety, activation steering, and voice defense</text>

    <g transform="translate(0 158)">
      <rect x="0" y="0" width="148" height="38" rx="19" fill="#111827" stroke="#2DD4BF" stroke-opacity="0.55"/>
      <text x="22" y="25" fill="#E5E7EB" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">VLM Safety</text>

      <rect x="164" y="0" width="206" height="38" rx="19" fill="#111827" stroke="#A78BFA" stroke-opacity="0.55"/>
      <text x="185" y="25" fill="#E5E7EB" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">Mechanistic Interpretability</text>

      <rect x="386" y="0" width="190" height="38" rx="19" fill="#111827" stroke="#FB7185" stroke-opacity="0.55"/>
      <text x="407" y="25" fill="#E5E7EB" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">Audio Deepfake Defense</text>
