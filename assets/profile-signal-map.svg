  <g transform="translate(653 101)" filter="url(#softGlow)">
    <path d="M96 171L176 87L272 123L365 48L455 99" stroke="url(#signal)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M96 171L180 216L272 123L365 193L455 99" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g>
      <circle cx="96" cy="171" r="22" fill="#0B1020" stroke="#2DD4BF" stroke-width="5"/>
      <text x="96" y="211" text-anchor="middle" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">probe</text>
    </g>
    <g>
      <circle cx="176" cy="87" r="22" fill="#0B1020" stroke="#67E8F9" stroke-width="5"/>
      <text x="176" y="52" text-anchor="middle" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">failure</text>
    </g>
    <g>
      <circle cx="272" cy="123" r="26" fill="#0B1020" stroke="#A78BFA" stroke-width="5"/>
      <text x="272" y="166" text-anchor="middle" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">interpret</text>
    </g>
    <g>
      <circle cx="365" cy="48" r="22" fill="#0B1020" stroke="#FBBF24" stroke-width="5"/>
      <text x="365" y="14" text-anchor="middle" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">steer</text>
    </g>
    <g>
      <circle cx="455" cy="99" r="28" fill="#0B1020" stroke="#FB7185" stroke-width="5"/>
      <text x="455" y="144" text-anchor="middle" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">defend</text>
    </g>
